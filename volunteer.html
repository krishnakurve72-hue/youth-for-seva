<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Youth for Seva - a volunteering movement channeling the energy of young India into service.">
    <title>Volunteer | Youth for Seva</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-white text-gray-800 min-h-screen flex flex-col">

    <!-- ===== NAVBAR ===== -->
    <header class="bg-orange-600 text-white sticky top-0 z-10 shadow">
        <div class="max-w-5xl mx-auto flex items-center justify-between px-6 py-3">

            <a href="index.html" class="flex items-center gap-2 font-bold text-xl">
                <svg class="h-9 w-9" viewBox="0 0 40 40" role="img" aria-label="Youth for Seva logo">
                    <circle cx="20" cy="20" r="20" fill="#fff"/>
                    <path d="M20 31 C8 22 9 12 15 12 C18 12 20 15 20 15 C20 15 22 12 25 12 C31 12 32 22 20 31Z" fill="#ea580c"/>
                </svg>
                Youth for Seva
            </a>

            <!-- menu button (phones) -->
            <button id="menuBtn" class="md:hidden border border-white/60 rounded px-3 py-1" aria-label="Open menu" aria-expanded="false">&#9776;</button>

            <!-- tabs -->
            <nav id="menu" class="hidden md:flex gap-2 text-sm absolute md:static top-full left-0 w-full md:w-auto bg-orange-600 md:bg-transparent flex-col md:flex-row px-6 pb-3 md:p-0">
                <a href="index.html" class="px-4 py-2 rounded transition hover:bg-orange-700">Home</a>
                <a href="about.html" class="px-4 py-2 rounded transition hover:bg-orange-700">About</a>
                <a href="programs.html" class="px-4 py-2 rounded transition hover:bg-orange-700">Programs</a>
                <a href="volunteer.html" class="px-4 py-2 rounded transition bg-white text-orange-700 font-semibold" aria-current="page">Volunteer</a>
                <a href="contact.html" class="px-4 py-2 rounded transition hover:bg-orange-700">Contact</a>
            </nav>
        </div>
    </header>

    <main class="flex-1">

        <section class="max-w-xl mx-auto py-14 px-6">
            <h1 class="text-3xl font-bold mb-2">Become a volunteer</h1>
            <p class="text-gray-600 mb-6">Fill in your details and we will get in touch.</p>

            <form id="volunteerForm" novalidate>
                <label for="vName" class="font-medium">Full name</label>
                <input type="text" id="vName" class="w-full border p-2 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-orange-400">

                <label for="vEmail" class="font-medium">Email</label>
                <input type="email" id="vEmail" class="w-full border p-2 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-orange-400">

                <label for="vPhone" class="font-medium">Phone (10 digits)</label>
                <input type="tel" id="vPhone" maxlength="10" class="w-full border p-2 rounded mb-3 focus:outline-none focus:ring-2 focus:ring-orange-400">

                <label for="vProgram" class="font-medium">Which programme interests you?</label>
                <select id="vProgram" class="w-full border p-2 rounded mb-4 focus:outline-none focus:ring-2 focus:ring-orange-400">
                    <option>Vidya Chetana</option>
                    <option>Doctors for Seva</option>
                    <option>Seva Circle</option>
                    <option>Environment &amp; Rural Development</option>
                </select>

                <button type="submit" class="w-full bg-orange-600 hover:bg-orange-700 text-white p-2 rounded transition">Submit</button>
                <p id="formMsg" class="mt-4 text-center" role="alert"></p>
            </form>
        </section>

    </main>

    <!-- ===== FOOTER ===== -->
    <footer class="bg-gray-900 text-gray-300 text-sm py-6 text-center">
        <p>Youth for Seva &middot; est. 2007, Bengaluru</p>
        <p class="text-gray-400 mt-1">Seva Swabhava Apna, Hum Nitya Hi Sanjeeve</p>
    </footer>

    <script>
        // open / close the menu on phones
        var btn = document.getElementById("menuBtn");
        var menu = document.getElementById("menu");
        btn.addEventListener("click", function () {
            var open = menu.classList.toggle("hidden");
            btn.setAttribute("aria-expanded", open ? "false" : "true");
        });

        document.getElementById("volunteerForm").addEventListener("submit", function (e) {
            e.preventDefault();

            var name = document.getElementById("vName").value.trim();
            var email = document.getElementById("vEmail").value.trim();
            var phone = document.getElementById("vPhone").value.trim();
            var msg = document.getElementById("formMsg");

            function error(text) {
                msg.innerText = text;
                msg.className = "mt-4 text-center text-red-600";
            }

            if (name === "" || email === "" || phone === "") {
                error("Please fill in all the fields.");
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                error("Please enter a valid email address.");
                return;
            }
            if (!/^[0-9]{10}$/.test(phone)) {
                error("Phone number must be exactly 10 digits.");
                return;
            }

            msg.innerText = "Thank you, " + name + "! We will contact you soon.";
            msg.className = "mt-4 text-center text-green-700";
            document.getElementById("volunteerForm").reset();
        });

    </script>
</body>
</html>
